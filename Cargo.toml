[package]
name = "stream-diffusion-rust"
version = "0.1.0"
edition = "2021"
description = "Stream diffusion implementation in Rust using Burn framework"
authors = ["Kapil"]
license = "MIT"
repository = "https://github.com/compiling-org/stream-diffusion-rust"
homepage = "https://github.com/compiling-org/stream-diffusion-rust"
keywords = ["ml", "diffusion", "ai", "stream", "burn"]
categories = ["science", "multimedia", "api-bindings"]

[dependencies]
# Burn ML framework
burn = { version = "0.18", features = ["train", "dataset"] }
burn-ndarray = { version = "0.18" }
burn-wgpu = { version = "0.18" }

# Image processing
image = "0.25"
imageproc = "0.25"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client for model loading
reqwest = { version = "0.12", features = ["json", "stream"] }

# Utilities
anyhow = "1.0"
thiserror = "1.0"
rand = "0.8.5"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

[features]
default = []
gpu = ["burn-wgpu"]