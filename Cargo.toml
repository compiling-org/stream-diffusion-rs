[package]
name = "stream-diffusion-rs"
version = "0.1.0"
edition = "2021"
description = "Stream diffusion implementation in Rust using Burn framework"
authors = ["Kapil"]
license = "MIT"
repository = "https://github.com/compiling-org/stream-diffusion-rs"
homepage = "https://github.com/compiling-org/stream-diffusion-rs"
keywords = ["ml", "diffusion", "ai", "stream", "burn"]
categories = ["science", "multimedia", "api-bindings"]

[dependencies]
# ONNX runtime for model inference
ort = "1.16"

# Data processing and ML utilities
ndarray = { version = "0.15", features = ["serde"] }
ndarray-stats = "0.5"
ndarray-rand = "0.14"
rand = "0.8"

# Visualization
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "bitmap_backend", "line_series"] }

# Audio processing for audiovisual conversion
rodio = "0.17"
hound = "3.5"  # WAV file handling

# Image processing
image = "0.24"

# Async runtime for streaming and web server
tokio = { version = "1.0", features = ["full", "rt-multi-thread"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Serialization for model configs
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

# Web interface
axum = { version = "0.7", features = ["multipart", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
mime_guess = "2.0"
chrono = "0.4.42"

[features]
default = []
